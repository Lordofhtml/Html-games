function isR(p){return p===1||p===3}function isB(p){return p===2||p===4}function isK(p){return p===3||p===4}function inB(r,c){return r>=0&&r<8&&c>=0&&c<8}

function am(col,b){b=b||B;var cp=[],al=[];for(var r=0;r<8;r++)for(var c=0;c<8;c++){if(!b||!b[r])continue;if(MC&&col===T&&!(r===MC.r&&c===MC.c))continue;var p=b[r][c];if((col==='red'&&isR(p))||(col==='black'&&isB(p))){var ms=mf(r,c,b);for(var i=0;i<ms.length;i++){if(ms[i].cap)cp.push(ms[i]);else al.push(ms[i])}}}return cp.length?cp:al}
function render(){boardEl.innerHTML='';for(var r=0;r<8;r++)for(var c=0;c<8;c++){(function(rr,cc){var d=document.createElement('div');d.className='cl '+((rr+cc)%2===0?'l':'k');if(S&&S.r===rr&&S.c===cc)d.classList.add('sel');var vm=null;for(var i=0;i<M.length;i++)if(M[i].x===rr&&M[i].y===cc)vm=M[i];if(vm)d.classList.add(vm.cap?'hc':'ht');var p=B[rr][cc];if(p!==0&&!(HF&&HF.r===rr&&HF.c===cc)&&!(HF&&HF.cr===rr&&HF.cc===cc)){var pc=document.createElement('div');pc.className='p '+(isR(p)?'r':'bl')+(isK(p)?' kg':'');if(S&&S.r===rr&&S.c===cc)pc.style.outline='3px solid #ffd700';pc.textContent=isK(p)?'':'●';d.appendChild(pc)}d.addEventListener('click',function(){clickSquare(rr,cc)});boardEl.appendChild(d)})(r,c)}winCount.textContent=W}
function clickSquare(r,c){if(OV||AN)return;if(FM==='ai'&&T!=='red')return;var p=B[r][c],my=(T==='red'&&isR(p))||(T==='black'&&isB(p));if(my){if(MC&&!(r===MC.r&&c===MC.c))return;var al=am(T),cp=al.filter(function(m){return m.cap}),aw=cp.length?cp:al,my2=aw.filter(function(m){return m.a===r&&m.b===c});if(!my2.length){statusText.textContent=cp.length?'⚠️ MUST capture!':'No moves';snd(140,.2);return}S={r:r,c:c};M=my2;snd(600,.12);render();return}if(S){var mv=null;for(var i=0;i<M.length;i++)if(M[i].x===r&&M[i].y===c)mv=M[i];if(mv)doMove(mv)}}
function doMove(mv){AN=true;var piece=B[mv.a][mv.b],src=boardEl.children[mv.a*8+mv.b],dst=boardEl.children[mv.x*8+mv.y],clone=null;if(src&&dst){var a=src.getBoundingClientRect(),z=dst.getBoundingClientRect();clone=document.createElement('div');clone.className='moving-piece '+(isR(piece)?'r':'bl')+(isK(piece)?' king':'');clone.style.left=(a.left+a.width*.11)+'px';clone.style.top=(a.top+a.height*.11)+'px';clone.style.width=(a.width*.78)+'px';clone.style.height=(a.height*.78)+'px';clone.style.border='2px solid '+(isR(piece)?'#fff':'#888');clone.textContent=isK(piece)?'♛':'●';document.body.appendChild(clone);HF={r:mv.a,c:mv.b,cr:mv.cap?mv.cr:-1,cc:mv.cap?mv.cc:-1};render();requestAnimationFrame(function(){clone.style.left=(z.left+z.width*.11)+'px';clone.style.top=(z.top+z.height*.11)+'px'});}else{HF={r:mv.a,c:mv.b,cr:mv.cap?mv.cr:-1,cc:mv.cap?mv.cc:-1};render()}if(mv.cap){tone(180,.2,'sawtooth',.5,60);setTimeout(function(){tone(500,.15,'square',.45)},80)}else tone(220,.15,'triangle',.45,320);setTimeout(function(){if(clone&&clone.parentNode)clone.remove();finishMove(mv)},180)}

function checkWin(){var red=0,black=0;for(var r=0;r<8;r++)for(var c=0;c<8;c++){if(isR(B[r][c]))red++;if(isB(B[r][c]))black++}var rm=am('red'),bm=am('black');if(FM==='friend'){if(black===0||!bm.length){OV=true;statusText.textContent='🎉 🔴 RED WINS!';[523,659,784,1046].forEach(function(n,i){setTimeout(function(){tone(n,.3,'triangle',.5)},i*140)});render();return true}if(red===0||!rm.length){OV=true;statusText.textContent='🎉 ⚫ BLACK WINS!';[523,659,784,1046].forEach(function(n,i){setTimeout(function(){tone(n,.3,'triangle',.5)},i*140)});render();return true}return false}if(black===0||!bm.length){OV=true;W++;try{localStorage.setItem('cw',W)}catch(e){}statusText.textContent='🎉 YOU WIN!';[523,659,784,1046].forEach(function(n,i){setTimeout(function(){tone(n,.3,'triangle',.5)},i*140)});render();return true}if(red===0||!rm.length){OV=true;statusText.textContent='🤖 AI WINS!';[400,300,200,120].forEach(function(n,i){setTimeout(function(){tone(n,.3,'sawtooth',.4)},i*160)});render();return true}return false}
function boardKey(b){return b.map(function(row){return row.join('')}).join('')}
