<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Battle</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f8ff;background:linear-gradient(145deg,#10152d,#242b55);display:grid;place-items:center;padding:16px;transition:background .4s}body.p1{background:linear-gradient(145deg,#132b47,#245d85)}body.p2{background:linear-gradient(145deg,#422044,#833d6e)}body.single{background:linear-gradient(145deg,#10152d,#242b55)}.app{width:min(100%,480px)}.panel{background:rgba(12,15,30,.82);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px;box-shadow:0 20px 60px #0004;backdrop-filter:blur(12px)}h1{font-size:clamp(30px,8vw,42px);margin:0 0 6px;text-align:center;letter-spacing:-1px}h1 span{color:#8af5c6}.subtitle{text-align:center;color:#b8c2e2;margin:0 0 22px}.menu,.answers{display:grid;gap:12px}.btn{border:0;border-radius:15px;padding:15px 16px;color:white;font-weight:800;font-size:16px;cursor:pointer;transition:transform .12s,filter .12s;background:#30395f}.btn:active{transform:scale(.98)}.btn.easy{background:linear-gradient(120deg,#1aaf76,#39d69b)}.btn.normal{background:linear-gradient(120deg,#cc8b25,#f5bd4f)}.btn.hard{background:linear-gradient(120deg,#d64758,#ff6578)}.btn.duo{background:linear-gradient(120deg,#7855db,#aa76ff)}.btn.secondary{background:#333a58}.hide{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#c7d0ec;font-size:14px}.pill{background:#30395c;border-radius:30px;padding:8px 12px;font-weight:700}.hearts{font-size:23px;letter-spacing:2px;color:#ff637b;white-space:nowrap}.question{font-size:clamp(34px,10vw,48px);font-weight:900;text-align:center;margin:22px 0 25px;letter-spacing:1px}.answers .btn{font-size:22px;padding:17px;background:#303a62;border:1px solid #ffffff14}.answers .btn.correct{background:#15996b}.answers .btn.wrong{background:#c63e55}.feedback{text-align:center;min-height:26px;margin:14px 0 0;font-weight:800}.small{text-align:center;color:#aeb8d8;font-size:13px;margin-top:16px}.score{text-align:center;font-size:22px;font-weight:800;margin:10px 0}.result{text-align:center;padding:10px 0}.result h2{font-size:30px;margin:10px 0}.result p{color:#c2cbe5}.name-row{display:flex;gap:10px;margin-bottom:14px}.name-row input{width:50%;min-width:0;background:#202744;color:white;border:1px solid #4a557d;border-radius:12px;padding:12px;font-size:16px}.free-toggle{display:flex;align-items:center;gap:12px;margin:16px 0;padding:13px;background:#222b49;border:1px solid #4b5b83;border-radius:14px;cursor:pointer}.free-toggle input{width:20px;height:20px;accent-color:#42d99a}.free-toggle span{display:grid;gap:2px}.free-toggle small{color:#aeb8d8;font-size:12px}.select-wrap{margin:0 0 14px;text-align:left}.select-wrap label{display:block;color:#b8c2e2;font-size:13px;font-weight:700;margin:0 0 6px}.select-wrap select{width:100%;padding:12px;border-radius:12px;border:1px solid #4a557d;background:#202744;color:#fff;font-size:16px}.back{width:100%;margin-top:14px}.turn-banner{text-align:center;font-size:17px;font-weight:900;margin:8px 0 0}.timer-wrap{margin:8px 0 14px}.timer-line{display:flex;justify-content:space-between;font-weight:800;color:#dce4ff;margin-bottom:6px}.timer-track{height:9px;border-radius:99px;background:#30395c;overflow:hidden}.timer-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#43d9a0,#68b7ff);transition:width .25s linear}.timer-fill.low{background:linear-gradient(90deg,#ff9b46,#ff526d)}
</style></head><body class="single"><main class="app"><section class="panel" id="home"><h1>🧠 Math <span>Battle</span></h1><p class="subtitle">Quick brain battles. Choose your game.</p><div class="menu"><button class="btn easy" onclick="startSingle('easy')">🟢 Easy</button><button class="btn normal" onclick="startSingle('normal')">🟡 Normal</button><button class="btn hard" onclick="startSingle('hard')">🔴 Hard</button><button class="btn duo" onclick="showDuoSetup()">👥 Friend vs Friend</button></div><label class="free-toggle"><input type="checkbox" id="freeMode"> <span><b>♾️ Free Mode</b><small>Unlimited hearts — no elimination</small></span></label><p class="small">3 choices · 3 hearts · Don't lose them all!</p></section>
<section class="panel hide" id="setup"><h1>👥 Battle Setup</h1><p class="subtitle">Enter player names and choose battle settings</p><div class="select-wrap"><label for="duoDifficulty">Battle difficulty</label><select id="duoDifficulty"><option value="easy">🟢 Easy · 15 seconds</option><option value="normal">🟡 Normal · 12 seconds</option><option value="hard">🔴 Hard · 10 seconds</option></select></div><div class="name-row"><input id="name1" maxlength="14" placeholder="Player 1" value="Player 1"><input id="name2" maxlength="14" placeholder="Player 2" value="Player 2"></div><label class="free-toggle"><input type="checkbox" id="duoFreeMode"> <span><b>♾️ Free Mode</b><small>Unlimited hearts — play without elimination</small></span></label><button class="btn duo" style="width:100%" onclick="startDuo()">Start Battle ⚔️</button><button class="btn secondary back" onclick="goHome()">Back</button></section>
<section class="panel hide" id="game"><div class="topline"><span class="pill" id="modeLabel">Easy</span><span class="pill" id="roundLabel">Question 1</span></div><div class="topline" id="duoStats"><span id="p1stats"></span><span id="p2stats"></span></div><div class="hearts" id="heartDisplay">❤️❤️❤️</div><div class="turn-banner" id="turnBanner"></div><div class="timer-wrap"><div class="timer-line"><span>⏱ Time left</span><span id="timerLabel">15s</span></div><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div></div><div class="question" id="question">4 + 5 = ?</div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="btn secondary back hide" id="quitBtn" onclick="goHome()">Home</button></section>
<section class="panel hide" id="result"><div class="result"><h1>🏆</h1><h2 id="resultTitle">Game Over</h2><p id="resultText"></p><button class="btn duo" style="width:100%" onclick="goHome()">Play Again</button></div></section></main>
<script>
const screens=['home','setup','game','result'];let mode='easy',duo=false,freeMode=false,players=[],turn=0,qnum=0,score=0,answered=false,correct=0,incorrect=0,current={},timerInterval=null,timeLeft=0,timeLimit=15,advanceTimeout=null;
const $=id=>document.getElementById(id);
function show(id){screens.forEach(s=>$(s).classList.toggle('hide',s!==id))}
function clearClock(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;if(advanceTimeout)clearTimeout(advanceTimeout);advanceTimeout=null}
function goHome(){clearClock();document.body.className='single';show('home')}
function finishGame(){if(freeMode&&!duo){endSingle();return}goHome()}
function showDuoSetup(){show('setup')}
function startSingle(m){clearClock();duo=false;freeMode=$('freeMode').checked;mode=m;score=0;qnum=0;correct=0;incorrect=0;timeLimit=m==='easy'?15:m==='normal'?12:10;document.body.className='single';$('duoStats').classList.add('hide');$('turnBanner').textContent='';$('modeLabel').textContent=m.charAt(0).toUpperCase()+m.slice(1);$('quitBtn').textContent=freeMode?'Finish & Results':'Home';$('quitBtn').onclick=finishGame;$('quitBtn').textContent='Home';$('quitBtn').onclick=goHome;$('quitBtn').classList.remove('hide');show('game');newQuestion()}
function startDuo(){clearClock();duo=true;freeMode=$('duoFreeMode').checked||$('freeMode').checked;mode=$('duoDifficulty').value;timeLimit=mode==='easy'?15:mode==='normal'?12:10;players=[{name:$('name1').value.trim()||'Player 1',hearts:freeMode?Infinity:3,score:0},{name:$('name2').value.trim()||'Player 2',hearts:freeMode?Infinity:3,score:0}];turn=0;qnum=0;document.body.className='p1';$('duoStats').classList.remove('hide');$('quitBtn').classList.remove('hide');show('game');newQuestion()}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function makeProblem(){let a,b,op,ans;if(mode==='easy'){a=rnd(1,20);b=rnd(1,20);op=Math.random()<.65?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];ans=op==='+'?a+b:a-b;}else if(mode==='normal'){op=['+','−','×'][rnd(0,2)];a=rnd(2,40);b=rnd(2,20);if(op==='−'&&b>a)[a,b]=[b,a];ans=op==='+'?a+b:op==='−'?a-b:a*b;}else{op=['+','−','×','÷'][rnd(0,3)];if(op==='÷'){b=rnd(2,12);ans=rnd(2,15);a=b*ans;}else{a=rnd(10,99);b=rnd(10,99);if(op==='−'&&b>a)[a,b]=[b,a];ans=op==='+'?a+b:op==='−'?a-b:a*b;}}return {text:`${a} ${op} ${b} = ?`,ans}}
function newQuestion(){clearClock();answered=false;qnum++;current=makeProblem();$('question').textContent=current.text;$('roundLabel').textContent=duo?'Round '+qnum:'Question '+qnum;$('feedback').textContent='';$('quitBtn').classList.remove('hide');$('answers').innerHTML='';$('heartDisplay').textContent=duo?'':freeMode?'♾️ Unlimited hearts':'❤️'.repeat(Math.max(0,3-score));if(duo)updateDuoUI();let opts=new Set([current.ans]);while(opts.size<3){let spread=mode==='hard'?Math.max(8,Math.abs(current.ans)*.25):mode==='normal'?8:5;let v=current.ans+rnd(-spread,spread);if(v!==current.ans)opts.add(v)}let arr=[...opts].sort(()=>Math.random()-.5);arr.forEach(v=>{let btn=document.createElement('button');btn.className='btn';btn.textContent=v;btn.onclick=()=>choose(v,btn);$('answers').appendChild(btn)});startTimer()}
function startTimer(){timeLeft=timeLimit;renderTimer();timerInterval=setInterval(()=>{timeLeft--;renderTimer();if(timeLeft<=0){clearInterval(timerInterval);timerInterval=null;handleTimeout()}},1000)}
function renderTimer(){ $('timerLabel').textContent=timeLeft+'s';$('timerFill').style.width=Math.max(0,timeLeft/timeLimit*100)+'%';$('timerFill').classList.toggle('low',timeLeft<=Math.min(5,timeLimit/2)) }
function handleTimeout(){if(answered)return;answered=true;disableAnswers();$('feedback').textContent=freeMode?'⏰ Time up! Next question':'⏰ Time up! -1 heart';if(duo){if(!freeMode)players[turn].hearts--;finishDuoTurn()}else{incorrect++;if(!freeMode)score++;if(!freeMode&&score>=3){endSingle();return}advanceAutomatically()}}
function disableAnswers(){[...$('answers').children].forEach(b=>b.disabled=true)}
function choose(v,btn){if(answered)return;answered=true;clearInterval(timerInterval);timerInterval=null;disableAnswers();[...$('answers').children].forEach(b=>{if(Number(b.textContent)===current.ans)b.classList.add('correct')});if(v===current.ans){btn.classList.add('correct');$('feedback').textContent='✨ Correct!';if(duo)players[turn].score++;else correct++;}else{btn.classList.add('wrong');$('feedback').textContent=freeMode?'❌ Wrong answer! Keep going':'❌ Wrong! -1 heart';if(duo){if(!freeMode)players[turn].hearts--;finishDuoTurn();return}else{incorrect++;if(!freeMode)score++;}}if(!duo&&!freeMode&&score>=3){endSingle();return}if(duo){turn=1-turn;document.body.className=turn===0?'p1':'p2';updateDuoUI()}advanceAutomatically()}
function finishDuoTurn(){if(!freeMode&&players[turn].hearts<=0){endDuo();return}turn=1-turn;document.body.className=turn===0?'p1':'p2';updateDuoUI();advanceAutomatically()}
function advanceAutomatically(){if(advanceTimeout)clearTimeout(advanceTimeout);advanceTimeout=setTimeout(()=>newQuestion(),650)}
function updateDuoUI(){let p=players[0],q=players[1];$('p1stats').textContent=`${p.name} ${freeMode?'♾️':'❤️'.repeat(p.hearts)} · ${p.score}`;$('p2stats').textContent=`${q.name} ${freeMode?'♾️':'❤️'.repeat(q.hearts)} · ${q.score}`;$('heartDisplay').textContent='';$('turnBanner').textContent='🎯 '+players[turn].name+'’s turn';$('modeLabel').textContent='Friend vs Friend · '+mode.charAt(0).toUpperCase()+mode.slice(1)+(freeMode?' · Free':'');}
function endDuo(){clearClock();show('result');let alive=players.filter(p=>p.hearts>0);let winner=alive.length===1?alive[0]:players[0].score===players[1].score?null:players[0].score>players[1].score?players[0]:players[1];$('resultTitle').textContent=winner?`🏆 ${winner.name} Wins!`:'🤝 Draw!';$('resultText').textContent=players.map(p=>`${p.name}: ${p.score} points · ${p.hearts} hearts left`).join(' | ')}
function endSingle(){clearClock();show('result');$('resultTitle').textContent='Game Over 💔';$('resultText').textContent=freeMode?`Free Mode results — Correct: ${correct} · Incorrect: ${incorrect} · Total: ${correct+incorrect}`:`You lost all 3 hearts! Correct answers: ${correct} · Incorrect: ${incorrect}`}
</script></body></html>
