<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub File Catcher</title>
  <style>
    body {
      margin: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      color: #58a6ff;
      font-size: 28px;
    }
    #stats {
      font-size: 16px;
      margin-top: 5px;
      color: #8b949e;
    }
    canvas {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #controls {
      margin-top: 12px;
    }
    button {
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2ea043;
    }
    button:disabled {
      background-color: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1 id="game-title">Loading Title...</h1>
    <div id="stats">Fetching 20 files from GitHub...</div>
  </div>

  <canvas id="gameCanvas" width="700" height="450"></canvas>

  <div id="controls">
    <button id="startBtn" disabled>Loading Files...</button>
  </div>

  <script>
    // ==========================================
    // 1. CUSTOMIZE YOUR GAME HERE
    // ==========================================
    const CONFIG = {
      gameName: "GITHUB REPO MINER", // <-- Name your game here
      owner: "facebook",              // <-- GitHub username or org
      repo: "react",                  // <-- Public repository name
      branch: "main",                 // <-- Branch name (usually 'main' or 'master')
      fileLimit: 20                   // <-- Number of files to fetch
    };

    // Apply game name to page title and header
    document.title = CONFIG.gameName;
    document.getElementById("game-title").textContent = CONFIG.gameName;

    // ==========================================
    // 2. GAME STATE & SETUP
    // ==========================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statsEl = document.getElementById("stats");
    const startBtn = document.getElementById("startBtn");

    let githubFiles = [];
    let fallingItems = [];
    let score = 0;
    let missed = 0;
    let fileIndex = 0;
    let isPlaying = false;
    let spawnTimer = null;

    // Player basket
    const player = {
      x: canvas.width / 2 - 50,
      y: canvas.height - 30,
      width: 100,
      height: 16,
      speed: 7,
      dx: 0
    };

    // ==========================================
    // 3. FETCH 20 FILES FROM GITHUB API
    // ==========================================
    async function fetchRepoFiles() {
      const apiUrl = `https://github.com{CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
        
        const data = await response.json();
        
        // Filter only files ('blob') and grab the first 20 filenames
        githubFiles = data.tree
          .filter(item => item.type === "blob")
          .slice(0, CONFIG.fileLimit)
          .map(item => item.path.split("/").pop());

        if (githubFiles.length === 0) {
          throw new Error("No files found in this repository.");
        }

        statsEl.textContent = `Loaded ${githubFiles.length} files from ${CONFIG.owner}/${CONFIG.repo}. Use Left/Right arrows or Mouse to catch!`;
        startBtn.textContent = "Start Game";
        startBtn.disabled = false;
      } catch (error) {
        statsEl.textContent = `Error: ${error.message}`;
        startBtn.textContent = "Failed to Load";
      }
    }

    // ==========================================
    // 4. GAME LOOP & MECHANICS
    // ==========================================
    function startGame() {
      score = 0;
      missed = 0;
      fileIndex = 0;
      fallingItems = [];
      isPlaying = true;
      startBtn.disabled = true;
      startBtn.textContent = "Playing...";
      updateStats();

      // Drop one of the 20 GitHub files every 1.1 seconds
      spawnTimer = setInterval(() => {
        if (fileIndex < githubFiles.length) {
          fallingItems.push({
            name: githubFiles[fileIndex],
            x: Math.random() * (canvas.width - 140) + 20,
            y: -20,
            speed: 2 + Math.random() * 1.5
          });
          fileIndex++;
        } else {
          clearInterval(spawnTimer);
        }
      }, 1100);

      requestAnimationFrame(gameLoop);
    }

    function updateStats() {
      statsEl.textContent = `Caught: ${score} / ${githubFiles.length}  |  Missed: ${missed}`;
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move & draw player
      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      ctx.fillStyle = "#58a6ff";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Update & draw falling GitHub files
      ctx.font = "14px monospace";
      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const item = fallingItems[i];
        item.y += item.speed;

        // Draw file pill
        const textWidth = ctx.measureText(item.name).width;
        const boxWidth = textWidth + 16;
        const boxHeight = 26;

        ctx.fillStyle = "#21262d";
        ctx.strokeStyle = "#3fb950";
        ctx.fillRect(item.x, item.y, boxWidth, boxHeight);
        ctx.strokeRect(item.x, item.y, boxWidth, boxHeight);

        ctx.fillStyle = "#c9d1d9";
        ctx.fillText(item.name, item.x + 8, item.y + 17);

        // Collision check with player
        if (
          item.y + boxHeight >= player.y &&
          item.y <= player.y + player.height &&
          item.x + boxWidth >= player.x &&
          item.x <= player.x + player.width
        ) {
          score++;
          fallingItems.splice(i, 1);
          updateStats();
          continue;
        }

        // Missed check
        if (item.y > canvas.height) {
          missed++;
          fallingItems.splice(i, 1);
          updateStats();
        }
      }

      // Check game over (all 20 files spawned and resolved)
      if (fileIndex >= githubFiles.length && fallingItems.length === 0) {
        isPlaying = false;
        startBtn.disabled = false;
        startBtn.textContent = "Play Again";
        ctx.fillStyle = "#58a6ff";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`Game Over! You caught ${score} of ${githubFiles.length} files.`, canvas.width / 2, canvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 5. CONTROLS (KEYBOARD & MOUSE)
    // ==========================================
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
      if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ArrowRight" || e.key === "d") {
        player.dx = 0;
      }
    });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left - player.width / 2;
    });

    startBtn.addEventListener("click", startGame);

    // Initialize fetch on load
    fetchRepoFiles();
  </script>
</body>
</html>
