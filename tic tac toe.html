<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic Tac Toe</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#24224b 0,#111326 45%,#080a13 100%);color:#f4f5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:14px;touch-action:manipulation}.wrap{max-width:460px;margin:auto}.screen{display:none}.screen.on{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#1d2037;border:1px solid #363a60;border-radius:14px;padding:9px 13px;font-weight:800;box-shadow:0 4px 18px #0003}.small{border:1px solid #414565;border-radius:12px;padding:9px 12px;font-weight:850;background:#20233b;color:#fff;margin:2px}.gold{background:#f6c945;color:#201a08;border-color:#f6c945}.hero{margin:12px 0 6px;font-size:45px;filter:drop-shadow(0 0 14px #a98bff55)}h1{font-size:35px;letter-spacing:2px;margin:0 0 4px}.sub{color:#aab0d0;font-size:13px;margin:0 0 15px}.btn{width:100%;padding:15px;margin:6px 0;border:1px solid #343858;border-radius:16px;font-size:16px;font-weight:900;color:#fff;cursor:pointer;background:#1b2036;box-shadow:0 5px 0 #0a0b15;transition:transform .12s,filter .12s}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0a0b15}.easy{background:linear-gradient(120deg,#1e9b65,#38d996);color:#082619;border:0}.normal{background:linear-gradient(120deg,#b27921,#ffc857);color:#2b1b02;border:0}.hard{background:linear-gradient(120deg,#b62f54,#ff637b);border:0}.friend{background:linear-gradient(120deg,#6540b2,#a981ff);border:0}.hint{font-size:12px;color:#aab0d0;margin:0 0 6px}.screen.game{padding-top:2px}.status{font-weight:900;color:#ffe177;margin:10px;min-height:25px}.scorebar{display:flex;justify-content:center;gap:9px;margin:9px 0}.scorecard{flex:1;max-width:150px;background:#171b2d;border:1px solid #343955;border-radius:14px;padding:8px}.scorecard strong{display:block;font-size:21px}.scorecard span{font-size:11px;color:#aab0d0;letter-spacing:1px}.board{width:min(88vw,380px);aspect-ratio:1;margin:12px auto;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:10px}.cell{border:1px solid #363a60;border-radius:21px;background:linear-gradient(145deg,#222640,#171a2d);display:flex;align-items:center;justify-content:center;font-size:clamp(54px,19vw,95px);font-weight:950;cursor:pointer;box-shadow:inset 0 0 18px #0004,0 6px 0 #0a0c18;transition:transform .15s,background .2s,border-color .2s;position:relative;overflow:hidden}.cell:active{transform:scale(.94)}.cell.x{color:#ff6f91;text-shadow:0 0 22px #ff527855;animation:pop .24s cubic-bezier(.2,1.5,.5,1)}.cell.o{color:#6de1ff;text-shadow:0 0 22px #42caff55;animation:pop .24s cubic-bezier(.2,1.5,.5,1)}.cell.win{background:linear-gradient(145deg,#4a452a,#282b38);border-color:#ffe16b;box-shadow:0 0 22px #ffe16b55;animation:winPulse .6s infinite alternate}.cell:disabled{cursor:default}.volumePanel{display:none;gap:10px;align-items:center;background:#222641;border:2px solid #f7d25b;border-radius:15px;padding:12px;margin:12px auto;width:min(100%,390px);box-shadow:0 12px 35px #0009}.volumePanel.show{display:flex}.volumePanel input{flex:1;min-width:0;accent-color:#ffd85a}.footerBtns{display:flex;gap:8px}.footerBtns button{flex:1}.note{color:#8f96b8;font-size:11px;margin:9px 0}.@keyframes pop{from{transform:scale(.3);opacity:.3}to{transform:scale(1);opacity:1}}@keyframes winPulse{to{transform:scale(.97);filter:brightness(1.3)}}@media(max-height:690px){body{padding:8px}.board{width:min(65vh,340px);gap:7px;margin:7px auto}.cell{border-radius:14px}.btn{padding:11px;margin:4px 0}}
</style></head><body><div class="wrap screen on" id="home"><div class="top"><b class="pill">🏆 Wins <span id="wins">0</span></b><div><button class="small gold" id="soundHome">🔊 Sound</button><button class="small" id="fullHome">⛶</button></div></div><div class="hero">✕ <span style="color:#6de1ff">◯</span></div><h1>TIC TAC TOE</h1><p class="sub">A quick game. No timers.</p><button class="btn easy" data-mode="easy">🟢 EASY</button><p class="hint">Random AI</p><button class="btn normal" data-mode="normal">🟡 NORMAL</button><p class="hint">Smarter AI</p><button class="btn hard" data-mode="hard">🔴 HARD</button><p class="hint">Unbeatable AI</p><button class="btn friend" data-mode="friend">🟣 FRIEND vs FRIEND</button><p class="hint">Two players, one device</p><div class="volumePanel" id="volumeHome">🔈 <input type="range" min="0" max="150" value="100" id="volHome"><span id="volLabelHome">100%</span><button class="small" id="closeVolHome">✕</button></div><p class="note">Tap sound button to toggle · Hold 4 seconds for volume</p></div>
<div class="wrap screen game" id="game"><div class="top"><b class="pill" id="playerLabel">✕ YOU</b><button class="small gold" id="soundGame">🔊 Sound</button><b class="pill" id="modeLabel">EASY</b></div><div class="status" id="status">Your turn</div><div class="scorebar"><div class="scorecard"><strong style="color:#ff7797" id="xScore">0</strong><span>PLAYER X</span></div><div class="scorecard"><strong style="color:#6de1ff" id="oScore">0</strong><span>PLAYER O</span></div><div class="scorecard"><strong id="drawScore">0</strong><span>DRAWS</span></div></div><div class="board" id="board"></div><div class="volumePanel" id="volumeGame">🔈 <input type="range" min="0" max="150" value="100" id="volGame"><span id="volLabelGame">100%</span><button class="small" id="closeVolGame">✕</button></div><div class="footerBtns"><button class="small gold" id="restart">↻ Restart</button><button class="small" id="homeBtn">⌂ Home</button></div><p class="note">Tap sound button to toggle · Hold 4 seconds for volume</p></div>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);const home=$('home'),game=$('game'),boardEl=$('board'),statusEl=$('status');let board=Array(9).fill(''),turn='X',mode='easy',over=false,wins=0,xWins=0,oWins=0,draws=0,aiTimer=null,soundOn=true,volume=1,audioCtx=null,holdTimer=null,holdTriggered=false,suppressClick=false,turnStartSound=false;
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];try{wins=+localStorage.getItem('tttWins')||0;soundOn=localStorage.getItem('tttSound')!=='off';let v=localStorage.getItem('tttVol');if(v!==null)volume=Math.max(0,Math.min(1.5,+v/100));xWins=+localStorage.getItem('tttXWins')||0;oWins=+localStorage.getItem('tttOWins')||0;draws=+localStorage.getItem('tttDraws')||0}catch(e){}$('wins').textContent=wins;$('xScore').textContent=xWins;$('oScore').textContent=oWins;$('drawScore').textContent=draws;
// Short synthesized effects: no assets/network and no sound at startup.
function audio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,dur=.09,type='sine',peak=.14,slide=null,delay=0){if(!soundOn)return;try{let c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+dur);g.gain.setValueAtTime(Math.max(.0001,peak*volume),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function fx(name){if(!soundOn)return;switch(name){case'X':tone(680,.07,'triangle',.12,820);break;case'O':tone(420,.09,'sine',.13,520);break;case'ui':tone(560,.045,'sine',.09,700);break;case'ai':tone(360,.08,'triangle',.09,440);break;case'tick':tone(920,.045,'square',.055,700);break;case'timeout':tone(180,.25,'sawtooth',.14,90);break;case'draw':tone(440,.14,'sine',.11,330);tone(330,.18,'sine',.1,280,.16);break;case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.15,null,i*.12));break;case'lose':[400,320,240].forEach((f,i)=>tone(f,.22,'triangle',.11,null,i*.15));break;}}
function updateSoundButtons(){let txt=soundOn?'🔊 Sound':'🔇 Muted';$('soundHome').textContent=txt;$('soundGame').textContent=txt}function toggleSound(){soundOn=!soundOn;try{localStorage.setItem('tttSound',soundOn?'on':'off')}catch(e){}updateSoundButtons();if(soundOn)fx('ui')}function showVolume(){let el=home.classList.contains('on')?$('volumeHome'):$('volumeGame');el.classList.add('show');if(soundOn)tone(700,.04,'sine',.03)}function hideVolume(){$('volumeHome').classList.remove('show');$('volumeGame').classList.remove('show')}
function bindSoundHold(id){let btn=$(id);btn.addEventListener('pointerdown',e=>{e.preventDefault();holdTriggered=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdTriggered=true;suppressClick=true;showVolume()},4000)});const release=()=>{clearTimeout(holdTimer);if(!holdTriggered){toggleSound()}else{setTimeout(()=>suppressClick=false,350)}};btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',()=>clearTimeout(holdTimer));btn.addEventListener('pointerleave',()=>clearTimeout(holdTimer));btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()})}bindSoundHold('soundHome');bindSoundHold('soundGame');
function setVolume(v){volume=+v/100;try{localStorage.setItem('tttVol',v)}catch(e){}$('volHome').value=v;$('volGame').value=v;$('volLabelHome').textContent=v+'%';$('volLabelGame').textContent=v+'%'}$('volHome').addEventListener('input',e=>setVolume(e.target.value));$('volGame').addEventListener('input',e=>setVolume(e.target.value));$('closeVolHome').onclick=hideVolume;$('closeVolGame').onclick=hideVolume;setVolume(Math.round(volume*100));updateSoundButtons();function clearAI(){if(aiTimer){clearTimeout(aiTimer);aiTimer=null}}function showScreen(which){home.classList.toggle('on',which==='home');game.classList.toggle('on',which==='game');hideVolume();clearAI()}
function setMode(m){mode=m;board=Array(9).fill('');turn='X';over=false;$('modeLabel').textContent=m==='friend'?'FRIEND':m.toUpperCase();$('playerLabel').textContent=m==='friend'?'✕ PLAYER X':'✕ YOU';statusEl.textContent=m==='friend'?'✕ PLAYER X TURN':'Your turn';showScreen('game');draw();fx('ui')}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));$('restart').onclick=()=>{fx('ui');setMode(mode)};$('homeBtn').onclick=()=>{fx('ui');showScreen('home')};$('fullHome').onclick=()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};function draw(){boardEl.innerHTML='';board.forEach((val,i)=>{let cell=document.createElement('button');cell.className='cell'+(val?' '+val.toLowerCase():'')+(over?' disabled':'');cell.type='button';cell.disabled=over||!!val;cell.setAttribute('aria-label',val?val:'empty cell '+(i+1));cell.textContent=val;cell.onclick=()=>play(i);boardEl.appendChild(cell)})}function getWin(b=board){for(const line of lines){if(b[line[0]]&&b[line[0]]===b[line[1]]&&b[line[1]]===b[line[2]])return{mark:b[line[0]],line}}return null}function available(b=board){return b.map((v,i)=>v===''?i:-1).filter(i=>i>=0)}
function endGame(w){over=true;clearAI();if(w){statusEl.textContent=w.mark==='X'?'✕ X WINS!':'◯ O WINS!';boardEl.querySelectorAll('.cell').forEach((c,i)=>{if(w.line.includes(i))c.classList.add('win')});if(mode==='friend'){if(w.mark==='X')xWins++;else oWins++;try{localStorage.setItem('tttXWins',xWins);localStorage.setItem('tttOWins',oWins)}catch(e){}$('xScore').textContent=xWins;$('oScore').textContent=oWins;fx('win')}else if(w.mark==='X'){wins++;try{localStorage.setItem('tttWins',wins)}catch(e){}$('wins').textContent=wins;fx('win')}else fx('lose')}else{statusEl.textContent='🤝 DRAW!';draws++;try{localStorage.setItem('tttDraws',draws)}catch(e){}$('drawScore').textContent=draws;fx('draw')}}
function play(i){if(over||board[i]||(mode!=='friend'&&turn==='O'))return;move(i);if(!over&&mode!=='friend'&&turn==='O')aiTimer=setTimeout(aiMove,360)}function move(i){if(over||board[i])return;board[i]=turn;fx(turn);draw();let w=getWin();if(w){endGame(w);return}if(available().length===0){endGame(null);return}turn=turn==='X'?'O':'X';statusEl.textContent=mode==='friend'?(turn==='X'?'✕ PLAYER X TURN':'◯ PLAYER O TURN'):(turn==='X'?'Your turn':'AI thinking...')}
function aiMove(){if(over||turn!=='O')return;let idx;if(mode==='easy'){let a=available();idx=a[Math.floor(Math.random()*a.length)]}else if(mode==='normal')idx=bestMove(false);else idx=bestMove(true);if(idx!==undefined){fx('ai');move(idx)}}function bestMove(perfect){let free=available();if(!free.length)return;let best=-Infinity,choice=free[0];for(let i of free){board[i]='O';let s=minimax(board,0,false,perfect);board[i]='';if(s>best){best=s;choice=i}}return choice}function minimax(b,d,maximizing,perfect){let w=getWin(b);if(w)return w.mark==='O'?10-d:d-10;if(!available(b).length)return 0;if(!perfect&&d>=2)return heuristic(b);if(maximizing){let val=-Infinity;for(let i of available(b)){b[i]='O';val=Math.max(val,minimax(b,d+1,false,perfect));b[i]=''}return val}else{let val=Infinity;for(let i of available(b)){b[i]='X';val=Math.min(val,minimax(b,d+1,true,perfect));b[i]=''}return val}}function heuristic(b){let score=0;for(let l of lines){let x=l.filter(i=>b[i]==='X').length,o=l.filter(i=>b[i]==='O').length;if(!x)score+=o===2?5:o===1?2:0;if(!o)score-=x===2?7:x===1?2:0}return score}

})();</script></body></html>
